<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COMMA — a treatise in five axioms</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0814; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #gate { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #efe8da; font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; cursor: pointer;
    background: radial-gradient(ellipse at center, #1c1330 0%, #0a0814 70%); transition: opacity .6s; user-select: none; overflow: hidden; }
  #gate::before { content: ''; position: absolute; width: 70vmin; height: 70vmin; border-radius: 50%; opacity: .22; filter: blur(40px);
    background: conic-gradient(from -90deg, hsl(15 90% 60%), hsl(45 90% 60%), hsl(75 90% 60%), hsl(105 90% 60%), hsl(135 90% 60%), hsl(165 90% 60%), hsl(195 90% 60%), hsl(225 90% 60%), hsl(255 90% 60%), hsl(285 90% 60%), hsl(315 90% 60%), hsl(345 90% 60%), hsl(15 90% 60%));
    animation: spin 23.46s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #gate > * { position: relative; }
  #gate h1 span:nth-child(1) { color: hsl(15 95% 66%); } #gate h1 span:nth-child(2) { color: hsl(87 95% 62%); }
  #gate h1 span:nth-child(3) { color: hsl(159 95% 60%); } #gate h1 span:nth-child(4) { color: hsl(231 95% 70%); } #gate h1 span:nth-child(5) { color: hsl(303 95% 68%); }
  #gate h1 span { display: inline-block; text-shadow: 0 0 30px currentColor; }
  #gate h1 { font-weight: 700; letter-spacing: .5em; font-size: clamp(40px, 9vw, 120px); margin: 0 0 .2em .5em; }
  #gate p { font-family: ui-monospace, "JetBrains Mono", monospace; font-size: 12px; letter-spacing: .2em; opacity: .55; margin: .4em; text-transform: uppercase; }
  #gate .go { color: #ffc85a; opacity: 1; margin-top: 2.5em; animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .35; } }
  #gate.gone { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="gate">
  <h1><span>C</span><span>O</span><span>M</span><span>M</span><span>A</span></h1>
  <p>a treatise in five axioms · 35 seconds</p>
  <p>531441 / 524288</p>
  <p class="go">click to begin · headphones</p>
  <p style="margin-top:3em;font-size:10px;opacity:.3">R — record webm &nbsp;·&nbsp; space — replay</p>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
