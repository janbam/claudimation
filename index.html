<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COMMA — a treatise in five axioms</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0814; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #gate { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .2em;
    color: #efe8da; font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; cursor: pointer;
    background: radial-gradient(ellipse at center, #17122a 0%, #0a0814 70%); transition: opacity .6s; user-select: none; }
  #gate h1 { font-weight: 400; letter-spacing: .45em; font-size: clamp(28px, 5vw, 64px); margin: 0 0 .5em .45em; }
  #gate p { font-family: ui-monospace, "JetBrains Mono", monospace; font-size: 12px; letter-spacing: .2em; opacity: .55; margin: .4em; text-transform: uppercase; }
  #gate .go { color: #efe8da; opacity: 1; margin-top: 1.5em; animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .35; } }
  #gate label { font-family: ui-monospace, monospace; font-size: 12px; letter-spacing: .12em; opacity: .8; margin-top: 2.2em; display: flex; gap: 1em; align-items: center; cursor: default; }
  #gate input[type=range] { width: 220px; accent-color: #d97757; cursor: pointer; }
  #gate.gone { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="gate">
  <h1>COMMA</h1>
  <p class="go">click to begin · headphones</p>
  <label onclick="event.stopPropagation()">speed <input id="speed" type="range" min="0.5" max="1.5" step="0.01" value="1"> <span id="speedv">1.00×</span></label>
  <p style="margin-top:2.5em;font-size:10px;opacity:.3">space — replay &nbsp;·&nbsp; esc — back here &nbsp;·&nbsp; R — record webm &nbsp;·&nbsp; ?speed=0.9 in the url works too</p>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
